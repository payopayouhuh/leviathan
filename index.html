:root {
  --blue: #4fb6f2; --blue-mid: #3487c4; --blue-dim: #1f5f8c; --frame: #133954;
  --green: #5be381; --red: #ff5d40; --pink: #ff73cf; --white: #eef6f8; --amber: #ffb340;
  --bg: #000000; --ink: #4fb6f2;
  --font: "Hershey", "Lexend Exa", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --glow: 0 0 1.5px rgba(79,182,242,.9), 0 0 7px rgba(79,182,242,.35);
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* a vector display is black whatever the viewer’s theme */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #4fb6f2; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #4fb6f2; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; min-height: 780px; padding: 8px 14px 14px; gap: 8px; }
.topbar { display: flex; align-items: center; gap: 22px; min-height: 40px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 22px; margin-right: auto; }
.wordmark { font-weight: 500; font-size: 21px; letter-spacing: 7px; color: var(--blue); text-shadow: var(--glow); }
.tagline { font-size: 9.5px; letter-spacing: 1.8px; color: var(--blue-dim); text-transform: uppercase; }
.meters { display: flex; align-items: center; gap: 10px; font-size: 9.5px; letter-spacing: 1.6px; color: var(--blue-dim); text-transform: uppercase; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
.bars i { display: block; width: 3px; height: 12px; border: 1px solid var(--frame); }
.bars i.lit { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 4px rgba(79,182,242,.6); }
.bars i.hot { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 4px rgba(255,179,64,.6); }
.vol { cursor: pointer; padding: 4px 2px; touch-action: none; }
.vol i:nth-child(1) { height: 4px } .vol i:nth-child(2) { height: 6px } .vol i:nth-child(3) { height: 8px }
.vol i:nth-child(4) { height: 10px } .vol i:nth-child(5) { height: 12px } .vol i:nth-child(6) { height: 14px }
.meters .gap { width: 10px; }

.chip { background: none; border: 1px solid var(--frame); color: var(--blue-mid); font-size: 10.5px; letter-spacing: 1.8px; text-transform: uppercase; padding: 5px 13px 4px; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.chip:hover { border-color: var(--blue-dim); color: var(--blue); }
.chip.on, .chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 5px rgba(255,179,64,.35), inset 0 0 5px rgba(255,179,64,.12); text-shadow: 0 0 4px rgba(255,179,64,.6); }
.chip.blue.on { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 5px rgba(79,182,242,.35); text-shadow: var(--glow); }

.wall { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.col { display: grid; grid-template-rows: 168px minmax(190px, 1fr) 226px 176px; gap: 12px; min-height: 0; }
.row { display: grid; grid-template-columns: minmax(0, .7fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.screen { position: relative; border: 1px solid var(--frame); min-height: 0; overflow: hidden; background: #000; }
.screen.focus { border-color: #1b4f74; }
.screen > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hd { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; gap: 22px; align-items: baseline; pointer-events: none; z-index: 2; }
.ttl { font-size: 11.5px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--blue); text-shadow: var(--glow); }
.sub { font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--blue-dim); }
.hd .right { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
.hd .right .chip { padding: 3px 8px 2px; font-size: 9px; letter-spacing: 1.4px; }

#sc-creature { cursor: grab; touch-action: none; }
#sc-creature.held { cursor: grabbing; }
.start { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: rgba(0,0,0,.55); }
.start .box { border: 1px solid var(--blue-dim); padding: 26px 30px 24px; display: grid; gap: 16px; justify-items: center; background: #000; max-width: 320px; text-align: center; box-shadow: 0 0 10px rgba(79,182,242,.15); }
.start .lead { font-size: 10px; letter-spacing: 1.8px; color: var(--blue-mid); text-transform: uppercase; line-height: 1.7; }
.start .chip { font-size: 12px; padding: 9px 20px 8px; }
.start[hidden] { display: none; }

.gallery { position: absolute; inset: 38px 10px 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 2; }
.gallery button { background: none; border: 0; cursor: pointer; }
.gallery button:focus-visible { outline-offset: -2px; }

.calls { position: absolute; inset: 38px 14px 10px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; z-index: 2; }
.callrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.callrow .chip { flex: none; padding: 4px 12px 3px; }
.callrow .bar { flex: 1; height: 1px; background: var(--frame); position: relative; visibility: hidden; min-width: 30px; }
.callrow .bar i { position: absolute; left: 0; top: -0.5px; height: 2px; background: var(--amber); box-shadow: 0 0 4px rgba(255,179,64,.7); width: 0; }
.callrow.active .bar { visibility: visible; }
.calls .hint { font-size: 8.5px; letter-spacing: 1.4px; color: var(--blue-dim); text-transform: uppercase; margin-top: auto; padding-top: 4px; }

.pages { display: flex; gap: 4px; }
.pages button { width: 14px; height: 14px; padding: 0; border: 1px solid var(--frame); background: none; color: var(--blue-dim); font-size: 8.5px; cursor: pointer; line-height: 12px; }
.pages button[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 4px rgba(79,182,242,.4); }
.encs { position: absolute; inset: 36px 6px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); z-index: 2; }
.enc { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--c); min-width: 0; }
.enc .lab { font-size: 9.5px; letter-spacing: 2px; opacity: .85; text-transform: uppercase; text-shadow: 0 0 4px var(--c); white-space: nowrap; }
.enc .dial { width: 88px; height: 88px; touch-action: none; cursor: ns-resize; margin: 2px 0 0; }
.enc .dial svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 2px var(--c)); }
.enc:focus-within .dial { outline: 1.5px solid var(--amber); outline-offset: 2px; border-radius: 50%; }
.enc .num { font-size: 27px; font-weight: 500; letter-spacing: .6px; text-shadow: 0 0 2px var(--c), 0 0 9px var(--c); line-height: 1.05; margin-top: 4px; white-space: nowrap; }
.enc .unit { font-size: 8.5px; letter-spacing: 1.4px; opacity: .7; text-transform: uppercase; margin-top: 3px; }

@media (max-width: 1099px) {
  .app { height: auto; min-height: 0; }
  .wall { grid-template-columns: minmax(0, 1fr); }
  #sc-creature { height: min(80vh, 640px); min-height: 460px; }
  .col { grid-template-rows: none; grid-auto-rows: auto; }
  #sc-species { height: 160px; } #sc-spec { height: 230px; }
  .row { grid-template-columns: minmax(0, 1fr); }
  #sc-calls { height: 238px; } #sc-controls { height: 222px; } #sc-channel { height: 210px; }
  .tagline { display: none; }
}
@media (max-width: 760px) { #sc-channel .hd .sub { display: none; } }
@media (pointer: coarse) { .calls .hint { display: none; } }
@media (max-width: 560px) {
  .app { padding: 6px 8px 10px; }
  .wordmark { font-size: 17px; letter-spacing: 5px; }
  .meters .lvlwrap { display: none; }
  .enc .dial { width: 66px; height: 66px; }
  .enc .num { font-size: 21px; }
  #sc-controls { height: 196px; }
  .gallery { inset: 34px 4px 6px; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="wordmark">LEVIATHAN</span><span class="tagline">Song from simulated anatomy</span></div>
    <button class="chip blue" id="listen" aria-pressed="false" title="Turn the sound on or off">Hydrophone off</button>
    <div class="meters">
      <span class="lvlwrap" style="display:flex;gap:10px;align-items:center"><span>Level</span><div class="bars" id="lvl" aria-hidden="true"></div></span>
      <span class="gap"></span>
      <span>Vol</span>
      <div class="bars vol" id="vol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="6"></div>
    </div>
  </header>
  <main class="wall">
    <section class="screen" id="sc-creature" aria-label="Whale anatomy, live. Press and hold to sing, drag up or down to bend.">
      <canvas></canvas>
      <div class="hd"><span class="ttl">Cetacean</span><span class="sub" id="cre-sub">Larynx / live</span></div>
      <div class="start" id="start">
        <div class="box">
          <div class="lead">Sound starts with one tap.<br>Headphones help: the blue whale lives below 100 Hz.</div>
          <button class="chip on" id="startbtn">Dive in and listen</button>
        </div>
      </div>
    </section>
    <div class="col">
      <section class="screen" id="sc-species">
        <canvas></canvas>
        <div class="hd"><span class="ttl">Species</span><span class="sub">4 specimens</span></div>
        <div class="gallery" id="gallery" role="radiogroup" aria-label="Species"></div>
      </section>
      <section class="screen" id="sc-spec">
        <canvas></canvas>
        <div class="hd"><span class="ttl">Spectrogram</span><span class="sub" id="spec-sub">Waterfall of the call</span></div>
      </section>
      <div class="row">
        <section class="screen" id="sc-calls">
          <div class="hd"><span class="ttl">Calls</span><span class="sub" id="calls-sub">Song units</span></div>
          <div class="calls" id="calls"></div>
        </section>
        <section class="screen" id="sc-controls">
          <div class="hd"><span class="ttl">Controls</span><span class="sub" id="ctl-sub">Voice</span>
            <span class="right"><span class="pages" id="pages"><button aria-pressed="true" aria-label="Voice controls">1</button><button aria-pressed="false" aria-label="Ocean controls">2</button></span></span>
          </div>
          <div class="encs" id="encs"></div>
        </section>
      </div>
      <section class="screen" id="sc-channel">
        <canvas></canvas>
        <div class="hd"><span class="ttl">Sound channel</span><span class="sub">Rays to a hydrophone on the SOFAR axis</span>
          <span class="right" id="ranges"></span>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
function makeEngine() {
  const PI = Math.PI, TAU = 2 * PI;
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const rnd = Math.random;
  const C_AIR = 343, MU = 1.86e-5, NU0 = 1.5e-5;

  /* ------------------------------------------------------------------ two-mass valve
     Ishizaka & Flanagan (1972), with separate left and right masses so a tension imbalance
     between the sides can break the voice into subharmonics and chaos (Steinecke & Herzel 1995).
     SI units. Size sigma scales every length; tension Q scales stiffness up and mass down. */
  class Valve {
    constructor(sigma, lam = 1) {
      // lam stretches the fold along its length only: more air, same pitch
      const s = sigma;
      this.m1 = 1.25e-4 * s * s * s * lam; this.m2 = 2.5e-5 * s * s * s * lam;
      this.k1 = 80 * s * lam; this.k2 = 8 * s * lam; this.kc = 25 * s * lam;
      this.d1 = 2.5e-3 * s; this.d2 = 5e-4 * s; this.lg = 0.014 * s * lam;
      this.A0 = 5e-6 * s * s * lam; this.eta = 1e6 / (s * s); this.etah = 5e6 / (s * s);
      this.fBase = 127 / s;
      this.x = new Float64Array(4); this.v = new Float64Array(4); // 1L 2L 1R 2R
      this.U = 0; this.A1 = this.A0; this.A2 = this.A0; this.F1 = 0; this.F2 = 0;
      this.wasClosed = false; this.lastClose = -1; this.f0m = 0; this.n = 0; this.noise = 0;
      this.xm = 0; this.dev = 0; this.hi = false; this.lastUp = -1; this.closedN = 0; this.cycN = 0; this.cycSeen = 0; this.fexp = 100;
    }
    areas(ad) {
      const x = this.x, lg = this.lg, a0 = this.A0 * ad;
      this.A1 = a0 + lg * (x[0] + x[2]); this.A2 = a0 + lg * (x[1] + x[3]);
    }
    // flow through the valve for a pressure drop dp, with series inertance Lx and resistance Rx of the adjoining half-cells
    flow(dp, rho, dt, Lx, Rx) {
      // momentum form (flow × inertance), so a closing gap chokes the flow instead of accelerating it
      const A1 = this.A1, A2 = this.A2, am = A1 < A2 ? A1 : A2;
      if (am <= 1e-10) { this.U = 0; this.mom = 0; return 0; }
      const lg = this.lg;
      const L = rho * (this.d1 / A1 + this.d2 / A2) + Lx;
      const R = 12 * MU * lg * lg * (this.d1 / (A1 * A1 * A1) + this.d2 / (A2 * A2 * A2)) + Rx;
      const k = 0.5 * rho * (0.37 / (A1 * A1) + 1 / (am * am));
      const rhs = dp + (this.mom || 0) / dt, b = L / dt + R;
      const ar = rhs < 0 ? -rhs : rhs;
      const disc = b * b + 4 * k * ar;
      let U = ar * 1e-12 < 1e-30 ? 0 : (2 * ar) / (b + Math.sqrt(disc));
      if (rhs < 0) U = -U;
      this.U = U; this.mom = L * U;
      return U;
    }
    // advance the masses; pSub/pSup in Pa
    mech(pSub, pSup, rho, dt, Q, asym, ad, sub) {
      const lg = this.lg, d1 = this.d1, d2 = this.d2, U = this.U;
      const A1 = this.A1, A2 = this.A2;
      let F1, F2;
      if (A1 <= 0) { F1 = lg * d1 * pSub; F2 = lg * d2 * pSup; }
      else if (A2 <= 0) { F1 = lg * d1 * pSub; F2 = lg * d2 * pSub; }
      else {
        const vmax = 3 * Math.sqrt((2 * Math.abs(pSub - pSup) + 50) / rho);
        const v1 = clamp(U / A1, -vmax, vmax), v2 = clamp(U / A2, -vmax, vmax);
        const P11 = pSub - 1.37 * 0.5 * rho * v1 * v1;
        const P12 = P11 - 12 * MU * lg * lg * d1 * v1 / (A1 * A1);
        const P21 = P12 - 0.5 * rho * (v2 * v2 - v1 * v1);
        const P22 = P21 - 12 * MU * lg * lg * d2 * v2 / (A2 * A2);
        F1 = lg * d1 * 0.5 * (P11 + P12); F2 = lg * d2 * 0.5 * (P21 + P22);
      }
      this.F1 = F1; this.F2 = F2;
      const h = dt / sub, x = this.x, v = this.v, a0 = this.A0 * ad;
      for (let it = 0; it < sub; it++) {
        const s1 = a0 + lg * (x[0] + x[2]), s2 = a0 + lg * (x[1] + x[3]);
        const pen1 = s1 < 0 ? -s1 / (2 * lg) : 0, pen2 = s2 < 0 ? -s2 / (2 * lg) : 0;
        for (let side = 0; side < 2; side++) {
          const q = side === 0 ? Q * (1 - asym) : Q;
          const m1 = this.m1 / q, m2 = this.m2 / q, k1 = this.k1 * q, k2 = this.k2 * q, kc = this.kc * q;
          const i1 = side * 2, i2 = i1 + 1;
          const x1 = x[i1], x2 = x[i2];
          const z1 = pen1 > 0 ? 1.1 : 0.1, z2 = pen2 > 0 ? 1.6 : 0.6;
          const r1 = 2 * z1 * Math.sqrt(m1 * k1), r2 = 2 * z2 * Math.sqrt(m2 * k2);
          let f1 = F1 - r1 * v[i1] - k1 * x1 * (1 + this.eta * x1 * x1) - kc * (x1 - x2);
          let f2 = F2 - r2 * v[i2] - k2 * x2 * (1 + this.eta * x2 * x2) - kc * (x2 - x1);
          if (pen1 > 0) f1 += 3 * k1 * pen1 * (1 + this.etah * pen1 * pen1);
          if (pen2 > 0) f2 += 3 * k2 * pen2 * (1 + this.etah * pen2 * pen2);
          v[i1] += (f1 / m1) * h; v[i2] += (f2 / m2) * h;
        }
        for (let i = 0; i < 4; i++) x[i] += v[i] * h;
      }
      // pitch from the motion itself: crossings of the lower masses about their running mean, with hysteresis
      const xs = x[0] + x[2], fe = this.fexp || 100;
      const km = Math.min(0.2, TAU * fe * 0.12 * dt);
      this.xm += (xs - this.xm) * km;
      const dv = Math.abs(xs - this.xm);
      this.dev += (dv - this.dev) * km;
      const closedNow = A1 <= 0 || A2 <= 0;
      if (closedNow) this.closedN++;
      this.n++;
      if (!this.hi && xs > this.xm + 0.35 * this.dev && this.dev > ((this.A0 / this.lg) * 0.25) / Math.max(1, Q)) {
        this.hi = true;
        if (this.lastUp >= 0) {
          const f = 1 / ((this.n - this.lastUp) * dt);
          if (f > fe * 0.3 && f < fe * 4.5) { this.f0m = this.f0m ? this.f0m + (f - this.f0m) * 0.5 : f; this.cycN++; }
        }
        this.lastUp = this.n;
      } else if (this.hi && xs < this.xm - 0.35 * this.dev) this.hi = false;
      if (this.lastUp >= 0 && (this.n - this.lastUp) * dt > 4 / fe) { this.f0m = 0; this.lastUp = -1; this.hi = false; }
    }
    turb(rho) {
      // jet noise once the flow is turbulent (Reynolds number of the slit)
      const am = Math.min(this.A1, this.A2);
      if (am <= 1e-10 || this.U <= 0) return 0;
      const nu = MU / rho, Re = (2 * this.U) / (this.lg * nu);
      if (Re < 1800) return 0;
      const vel = this.U / am;
      return 0.5 * rho * vel * vel * (1 - (1800 * 1800) / (Re * Re));
    }
  }

  /* ------------------------------------------------------------------ FDTD airway network
     Staggered leapfrog: pressure in each cell, volume flow on each branch between cells.
     Branch inertance from half-sections, so a tiny cell next to a big one stays stable.
     Cavities (lungs, sacs) have muscle-driven yielding walls whose volume follows the air. */
  class Net {
    constructor(rho, dt) { this.rho = rho; this.dt = dt; this.K = rho * C_AIR * C_AIR; this.nodes = []; this.brs = []; this.tubes = {}; }
    node(A, D, wall) { this.nodes.push({ A, D, V0: A * D, wall }); return this.nodes.length - 1; }
    tube(name, L, A, wall, maxN = 80) {
      const dmin = (C_AIR * this.dt) / 0.95;
      const n = clamp(Math.floor(L / dmin), 1, maxN), D = L / n, ids = [];
      for (let i = 0; i < n; i++) {
        let w = null;
        if (wall) { const per = 2 * Math.sqrt(PI * A); w = Object.assign({ S: per * D }, wall); }
        ids.push(this.node(A, D, w));
        if (i) this.link(ids[i - 1], ids[i]);
      }
      this.tubes[name] = ids;
      return ids;
    }
    link(a, b, loss = 1) { this.brs.push({ a, b, loss }); return this.brs.length - 1; }
    finalize(lossHz) {
      const N = this.nodes.length, B = this.brs.length, rho = this.rho, dt = this.dt;
      this.N = N; this.B = B;
      this.p = new Float64Array(N); this.acc = new Float64Array(N); this.V0 = new Float64Array(N);
      this.Sw = new Float64Array(N); this.wm = new Float64Array(N); this.wk = new Float64Array(N); this.wr = new Float64Array(N);
      this.wy = new Float64Array(N); this.wv = new Float64Array(N); this.wa = new Float64Array(N); this.Pm = new Float64Array(N);
      this.half = new Float64Array(N); this.pdc = new Float64Array(N); this.pac = new Float64Array(N); this.prms = new Float64Array(N);
      this.nodes.forEach((n, i) => {
        this.V0[i] = n.V0; this.half[i] = (rho * n.D) / (2 * n.A);
        if (n.wall) { this.Sw[i] = n.wall.S; this.wm[i] = n.wall.m; this.wk[i] = n.wall.k; this.wr[i] = n.wall.r; }
      });
      this.ba = new Int32Array(B); this.bb = new Int32Array(B); this.bU = new Float64Array(B); this.bL = new Float64Array(B); this.bR = new Float64Array(B);
      this.brs.forEach((b, j) => {
        this.ba[j] = b.a; this.bb[j] = b.b;
        const L = this.half[b.a] + this.half[b.b];
        this.bL[j] = L; this.bR[j] = TAU * lossHz * L * b.loss;
      });
      this.valve = -1;
    }
    step(valveU) {
      const { p, acc, ba, bb, bU, bL, bR, B, N, dt } = this;
      acc.fill(0);
      for (let j = 0; j < B; j++) {
        const a = ba[j], b = bb[j];
        let U;
        if (j === this.valve) U = valveU;
        else { const L = bL[j]; U = (bU[j] * L + dt * (p[a] - p[b])) / (L + dt * bR[j]); }
        bU[j] = U; acc[a] -= U; acc[b] += U;
      }
      const K = this.K, Sw = this.Sw;
      for (let i = 0; i < N; i++) {
        let qw = 0;
        if (Sw[i] > 0) {
          const a = (p[i] - this.Pm[i] - this.wk[i] * this.wy[i] - this.wr[i] * this.wv[i]) / this.wm[i];
          this.wa[i] = a; this.wv[i] += a * dt; this.wy[i] += this.wv[i] * dt;
          qw = Sw[i] * this.wv[i];
        }
        const V = this.V0[i] + Sw[i] * this.wy[i];
        p[i] += ((dt * K) / (V > this.V0[i] * 0.05 ? V : this.V0[i] * 0.05)) * (acc[i] - qw);
      }
    }
    meter(k) { // acoustic pressure (DC removed), sampled sparsely for the display
      const { p, pdc, prms, N } = this;
      for (let i = 0; i < N; i++) { pdc[i] += (p[i] - pdc[i]) * k; const a = p[i] - pdc[i]; prms[i] += a * a; }
    }
  }

  /* ------------------------------------------------------------------ waveguides in oil and fat (exact 1D wave solution) */
  class Guide {
    constructor(maxLen) { this.f = new Float32Array(maxLen); this.b = new Float32Array(maxLen); this.n = maxLen; this.w = 0; this.D = 8; }
    // f travels from the near end to the far end, b travels back. read at fractional delay
    rd(buf, d) { const n = this.n, r = this.w - d, i = Math.floor(r), fr = r - i; return buf[((i % n) + n) % n] * (1 - fr) + buf[(((i + 1) % n) + n) % n] * fr; }
    farOut() { return this.rd(this.f, this.D); }
    nearOut() { return this.rd(this.b, this.D); }
    push(fIn, bIn) { this.f[this.w] = fIn; this.b[this.w] = bIn; this.w = (this.w + 1) % this.n; }
    at(u) { const d = u * this.D; return this.rd(this.f, d) + this.rd(this.b, this.D - d); } // pressure at fraction u from the near end
  }

  const SP = {
    humpback: { model: 0, gain: 0.75, def: { f0: 120, air: 1.2, sac: 0.5, rough: 0.15, pulse: 8, pdep: 0 } },
    blue: { model: 0, gain: 0.11, def: { f0: 17, air: 1.5, sac: 0.4, rough: 0.06, pulse: 1.6, pdep: 0 } },
    sperm: { model: 1, gain: 5e-5, def: { head: 5, power: 0.7, rate: 1.2, focus: 0.6 } },
    orca: { model: 2, gain: 1.2e-3, def: { low: 900, high: 7000, melon: 0.5, mix: 0.35, wf: 8000, whist: 0 } },
  };
  // anatomy (whale-time SI): sizes are estimates for a singing adult
  const ANAT = {
    humpback: { depth: 20, sigma: 1.2, lam: 1.6, sacK: [1.2e4, 9e4], lungV: 0.7, trachea: [0.45, 0.009], vest: [0.18, 0.005], neck: [0.08, 0.004], nasal: [0.9, 0.004], sacV: 0.012, sacS: 0.5 },
    blue: { depth: 30, sigma: 6.0, lam: 1.6, sacK: [800, 6000], lungV: 4.0, trachea: [1.1, 0.11], vest: [0.45, 0.08], neck: [0.25, 0.06], nasal: [2.2, 0.04], sacV: 0.6, sacS: 3.2 },
    sperm: { depth: 900, sigma: 1.0 },
    orca: { depth: 12, sigmaL: 0.15, sigmaR: 0.045 },
  };
  const MUL = { f0: 1, air: 1, pulse: 1, power: 1, rate: 1, low: 1, high: 1, wf: 1, head: 1 };

  class Engine {
    constructor(sr) {
      this.sr = sr; this.inv = 1 / sr;
      this.glob = { speed: 1, bend: 1, sea: 0.35 };
      this.bendS = 1; this.base = {}; this.cur = {}; this.tgt = {};
      this.hold = false; this.script = null; this.sT = 0; this.trIdx = {}; this.lastName = ""; this.done = 0;
      this.g = 0; this.gPrev = 0; this.pend = []; this.clickAcc = 0;
      this.click = { age: 99, kind: 0, n: 0, amp: 0 };
      this.brown = 0; this.brown2 = 0; this.prevW = 0; this.shr = 0; this.tAmb = 0;
      this.acc = 0; this.accN = 0; this.time = 0; this.stateN = 0;
      this.hpX = 0; this.hpY = 0; this.up = new Float64Array(16); this.upW = 0;
      this.trace = new Float32Array(256); this.trace2 = new Float32Array(256); this.flowT = new Float32Array(256); this.trW = 0; this.trDiv = 0;
      this.snap = null; this.snapRec = null; this.builtSpeed = 0;
      this.setSpecies("humpback");
    }
    setSpecies(id) {
      this.sp = id; this.cfg = SP[id]; this.def = this.cfg.def; this.an = ANAT[id];
      this.cur = {}; this.tgt = {};
      for (const k in this.def) { if (this.base[k] === undefined) this.base[k] = this.def[k]; this.cur[k] = this.base[k]; }
      this.script = null; this.g = 0; this.pend = [];
      this.build();
    }
    build() {
      const spd = this.glob.speed, an = this.an, md = this.cfg.model;
      this.builtSpeed = spd;
      this.rho = 1.2 * (1 + an.depth / 10);
      this.Qc = 1; this.QcR = 1; this.QcL = 1; this.ctlN = 0;
      if (md === 0) {
        this.irate = this.sr / 2; this.dt = spd / this.irate;
        const n = new Net(this.rho, this.dt);
        const lS = 8 * Math.cbrt(an.lungV), lK = (5000 * lS) / an.lungV;
        const lung = n.node(0.5, 0.5, { S: lS, m: 250, k: lK, r: 2 * Math.sqrt(lK * 250) });
        const tr = n.tube("trachea", an.trachea[0], an.trachea[1], null, 40);
        n.link(lung, tr[0]);
        const soft = { m: 40, k: 3e5, r: 2500 };
        const ve = n.tube("vest", an.vest[0], an.vest[1], soft, 24);
        const vb = n.link(tr[tr.length - 1], ve[0]);
        const nk = n.tube("neck", an.neck[0], an.neck[1], soft, 12);
        n.link(ve[ve.length - 1], nk[0]);

/* ---------------- waterfall spectrogram */
const wf = { rows: [], N: 44, cols: 150, tick: 0 };
function pushRow() {
  if (!analyser) return;
  analyser.getFloatFrequencyData(fbuf);
  const [fmin, fmax] = sp().spec, bins = fbuf.length, hz = AC.sampleRate / analyser.fftSize;
  const row = new Float32Array(wf.cols);
  for (let c = 0; c < wf.cols; c++) {
    const fa = fmin * Math.pow(fmax / fmin, c / wf.cols), fb = fmin * Math.pow(fmax / fmin, (c + 1) / wf.cols);
    let ia = Math.floor(fa / hz), ib = Math.max(ia, Math.floor(fb / hz));
    let m = -200; for (let i = ia; i <= ib && i < bins; i++) if (fbuf[i] > m) m = fbuf[i];
    row[c] = Math.max(0, Math.pow(clamp((m + 92) / 62, 0, 1), 2.3) - 0.035);
  }
  wf.rows.unshift(row); if (wf.rows.length > wf.N) wf.rows.pop();
}
function drawSpec(ctx, w, h) {
  if (++wf.tick % 2 === 0) pushRow();
  const left = 46, right = w - 74, base = h - 26, depthX = Math.min(90, w * 0.14), depthY = Math.min(130, h * 0.5), H = Math.min(88, h * 0.36);
  const fw = right - left - depthX;
  const [fmin, fmax] = sp().spec;
  const N = wf.N;
  // floor
  seg(ctx, [[left, base], [left + fw, base], [left + fw + depthX, base - depthY], [left + depthX, base - depthY], [left, base]], V.frame, 1, 1, false);
  for (const f of [100, 200, 500, 1000, 2000, 5000, 10000]) {
    if (f < fmin || f > fmax) continue;
    const u = Math.log(f / fmin) / Math.log(fmax / fmin), x = left + u * fw;
    seg(ctx, [[x, base], [x + depthX, base - depthY]], V.frame, 0.8, 0.8, false);
    txt(ctx, f >= 1000 ? `${f / 1000}K` : String(f), x, base + 14, 8, V.blueMid, { align: "center", ls: 1.2 });
  }
  const rows = wf.rows;
  for (let r = N - 1; r >= 0; r--) {
    const row = rows[r]; if (!row) continue;
    const v = r / (N - 1), ox = left + depthX * v, oy = base - depthY * v;
    const pts = [];
    for (let c = 0; c < wf.cols; c++) pts.push([ox + (c / (wf.cols - 1)) * fw, oy - row[c] * H]);
    ctx.globalCompositeOperation = "source-over";
    ctx.beginPath(); ctx.moveTo(ox, oy); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.lineTo(ox + fw, oy); ctx.closePath(); ctx.fillStyle = "#000"; ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    const a = 1 - v * 0.75;
    const path = new Path2D(); pts.forEach((p, i) => (i ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1])));
    ctx.globalAlpha = a; ctx.strokeStyle = V.amber; ctx.lineWidth = r === 0 ? 1.4 : 1; ctx.stroke(path);
    // the hottest peaks burn white
    ctx.strokeStyle = "#fff2d6"; ctx.lineWidth = 0.9; ctx.beginPath();
    for (let c = 1; c < wf.cols; c++) if (row[c] > 0.72 && row[c - 1] > 0.72) { ctx.moveTo(pts[c - 1][0], pts[c - 1][1]); ctx.lineTo(pts[c][0], pts[c][1]); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  const secs = (N * 2) / 60;
  txt(ctx, "NOW", right + 8, base + 3, 8, V.blueMid, { ls: 1.4 });
  txt(ctx, `${secs.toFixed(1)} S AGO`, right + depthX * 0 + 8, base - depthY + 3, 8, V.blueDim, { ls: 1.4 });
  txt(ctx, "HZ", left - 8, base + 14, 8, V.blueDim, { align: "right", ls: 1.2 });
  const spd = store.speed[store.sp];
  if (spd !== 1) txt(ctx, `HEARD ×${spdfmt(spd)}`, w - 16, 26, 8.5, V.amber, { align: "right", ls: 1.6, alpha: 0.9 });
  if (!analyser) txt(ctx, "WAITING FOR SOUND", left + fw / 2 + depthX / 2, base - depthY / 2 - 10, 9, V.blueDim, { align: "center", ls: 2 });
}

/* ---------------- sound channel */
const ZA = 1000, ZB = 5000;
const munk = (z) => { const n = (2 * (z - ZA)) / 1300; return 1500 * (1 + 0.00737 * (n - 1 + Math.exp(-n))); };
const dcdz = (z) => { const n = (2 * (z - ZA)) / 1300; return 1500 * 0.00737 * (1 - Math.exp(-n)) * (2 / 1300); };
const rays = { dirty: true, list: [], D: 0 };
function traceRays() {
  const D = store.ocean.dist * 1000, zs = sp().depth;
  const angles = [-13, -10, -7, -5, -3, -1.5, 0.5, 2, 3.5, 5, 7, 10, 13];
  const steps = 1600, dx = D / steps;
  rays.list = angles.map((deg) => {
    let x = 0, z = zs, th = (deg * PI) / 180, tt = 0, bottom = 0, surf = 0;
    const pts = [[0, z]];
    for (let i = 1; i <= steps; i++) {
      const c = munk(z);
      const thm = th - (dcdz(z) / c) * dx * 0.5, zm = z + Math.tan(th) * dx * 0.5;
      th = th - (dcdz(zm) / munk(zm)) * dx; z = z + Math.tan(thm) * dx;
      tt += dx / Math.cos(thm) / c;
      if (z < 0) { z = -z; th = -th; surf++; }
      if (z > ZB) { z = 2 * ZB - z; th = -th; bottom++; }
      x += dx;
      if (i % 8 === 0) pts.push([x, z]);
    }
    return { pts, tt, bottom, surf };
  });
  const ts = rays.list.map((r) => r.tt); rays.tmin = Math.min(...ts); rays.tmax = Math.max(...ts);
  rays.D = D; rays.dirty = false;
}
function drawChannel(ctx, w, h, t) {
  if (rays.dirty) traceRays();
  const now = performance.now() / 1000;
  const L = 74, R = w - 26, T = 44, B = h - 34;
  const X = (x) => L + (x / rays.D) * (R - L), Y = (z) => T + (z / ZB) * (B - T);
  // sound speed profile
  const prof = []; for (let z = 0; z <= ZB; z += 100) prof.push([14 + ((munk(z) - 1495) / 62) * 40, Y(z)]);
  seg(ctx, prof, V.blueMid, 1, 0.9, false);
  txt(ctx, "C(Z)", 14, T - 6, 7.5, V.blueDim, { ls: 1.2 });
  seg(ctx, [[L, Y(0)], [R, Y(0)]], V.blue, 1.1);
  txt(ctx, "SURFACE", R, Y(0) - 5, 7.5, V.blueMid, { align: "right", ls: 1.4 });
  const bot = new Path2D(); bot.moveTo(L, Y(ZB)); bot.lineTo(R, Y(ZB)); for (let x = L; x < R; x += 14) { bot.moveTo(x, Y(ZB)); bot.lineTo(x - 6, Y(ZB) + 6); }
  beam(ctx, bot, V.blueDim, 1, 0.9, false);
  ctx.setLineDash([3, 5]); seg(ctx, [[L, Y(ZA)], [R, Y(ZA)]], V.blueDim, 1, 0.9, false); ctx.setLineDash([]);
  txt(ctx, "SOFAR AXIS", L + 6, Y(ZA) - 5, 7.5, V.blueDim, { ls: 1.4 });
  txt(ctx, "0", L - 8, Y(0) + 3, 7.5, V.blueDim, { align: "right" });
  txt(ctx, "1 KM", L - 8, Y(ZA) + 3, 7.5, V.blueDim, { align: "right", ls: 1 });
  txt(ctx, "5 KM", L - 8, Y(ZB) + 3, 7.5, V.blueDim, { align: "right", ls: 1 });
  for (const r of rays.list) {
    const p = r.pts.map(([x, z]) => [X(x), Y(z)]);
    r.screen = p;
    seg(ctx, p, V.blueDim, 0.8, r.bottom ? 0.18 : 0.42, false);
  }
  // whale and hydrophone
  const zs = sp().depth, sx = X(0), sy = Y(zs);
  ctx.beginPath(); ctx.arc(sx, sy, 3, 0, TAU); ctx.fillStyle = V.green; ctx.fill();
  txt(ctx, sp().short.toUpperCase(), sx + 8, sy + 12, 7.5, V.green, { ls: 1.4 });
  const hx = R, hy = Y(ZA);
  seg(ctx, [[hx, hy - 5], [hx - 5, hy + 4], [hx + 5, hy + 4], [hx, hy - 5]], V.white, 1.1);
  txt(ctx, "HYDROPHONE", hx - 8, hy + 16, 7.5, V.white, { align: "right", ls: 1.4, alpha: 0.85 });
  // sound fronts riding the rays; steep rays dive into fast water and arrive first
  const VIS = 2.6;
  fx.emits = fx.emits.filter((e) => now - e.t0 < VIS * 1.2);
  for (const e of fx.emits) {
    for (const r of rays.list) {
      if (!r.screen) continue;
      const Ti = VIS * (0.75 + 0.25 * (r.tt - rays.tmin) / Math.max(1e-6, rays.tmax - rays.tmin));
      const u = (now - e.t0) / Ti;
      if (u < 0 || u > 1) continue;
      const n = r.screen.length - 1, idx = u * n, i0 = Math.floor(idx);
      const tr = []; for (let j = 0; j < 7; j++) { const k = Math.max(0, i0 - j * 2); tr.push(r.screen[k]); }
      seg(ctx, tr, V.amber, 1.5, e.a * (r.bottom ? 0.35 : 0.9));
    }
  }
  // readouts
  const d = store.ocean.dist, tt = (d * 1000) / 1490;
  const ttx = tt < 60 ? `${tt.toFixed(tt < 10 ? 1 : 0)} S` : `${Math.floor(tt / 60)} MIN ${Math.round(tt % 60)} S`;
  const cut = absorbCut(d);
  const y = h - 12;
  let x = 14;
  x += txt(ctx, "RANGE", x, y, 8, V.blueDim, { ls: 1.5 }) + 8;
  x += txt(ctx, `${kmfmt(d)} KM`, x, y, 10, V.green, { ls: 1.4, weight: 500 }) + 22;
  x += txt(ctx, "TRAVEL", x, y, 8, V.blueDim, { ls: 1.5 }) + 8;
  x += txt(ctx, ttx, x, y, 10, V.white, { ls: 1.4, weight: 500 }) + 22;
  if (w > 420) {
    x += txt(ctx, "SEA WATER EATS ABOVE", x, y, 8, V.blueDim, { ls: 1.5 }) + 8;
    txt(ctx, cut >= 1000 ? `${(cut / 1000).toFixed(1)} KHZ` : `${Math.round(cut)} HZ`, x, y, 10, V.amber, { ls: 1.4, weight: 500 });
  }
}

  new Scope(document.getElementById("sc-creature"), drawCreature),

  new Scope(document.getElementById("sc-channel"), drawChannel),

let lastT = performance.now();
function loop(ts) {

  for (const s of scopes) s.frame(t, dt);

  }

    analyser.getFloatTimeDomainData(tbuf); let s = 0; for (let i = 0; i < tbuf.length; i += 4) s += tbuf[i] * tbuf[i];
    const rms = Math.sqrt(s / (tbuf.length / 4)), db = 20 * Math.log10(rms + 1e-9), n = clamp(Math.round((db + 54) / 6), 0, 8);
    [...lvlEl.children].forEach((b, i) => { b.classList.toggle("lit", i < n && i < 6); b.classList.toggle("hot", i < n && i >= 6); });
  }
  requestAnimationFrame(loop);
}
selectSpecies("humpback", true);
renderRanges();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => wcache.clear());
})();
</script>
